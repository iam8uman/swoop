name: Build

on:
  push:
    branches: [main, pro]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Compile
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee compile.log || {
            # Report every compiler error in one annotation so it's readable from the API.
            grep -E "^[^ ].*error:" compile.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt
            echo "::error title=Compile errors::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' errors.txt)"
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee test.log || {
            grep -E "error|failed" test.log | sort -u | head -60 > failures.txt
            echo "::error title=Test failures::$(awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}' failures.txt)"
            exit 1
          }

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Release when main carries a version that hasn't been released yet (or when a v* tag is pushed).
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $VERSION"

      - name: Build Swoop.app
        run: VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Smoke test the app
        run: |
          set -euo pipefail
          APP=build/Swoop.app
          BIN=$APP/Contents/MacOS/Swoop
          plutil -lint $APP/Contents/Info.plist
          echo "Architectures: $(lipo -archs $BIN)"
          lipo -archs $BIN | grep -q arm64
          lipo -archs $BIN | grep -q x86_64
          codesign --verify --deep --strict $APP
          $BIN --version
          COUNT=$($BIN --list | grep -c '^swoop://')
          echo "swoop:// commands: $COUNT"
          test "$COUNT" -gt 60
          # Launch the real app and make sure it stays up (no Accessibility on CI, so it waits for permission).
          $BIN > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then
            echo "Swoop launched and is still running after 10s"
            kill $PID
          else
            echo "::error title=Launch crash::Swoop exited during launch: $(tail -20 launch.log | tr '\n' ' ')"
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3
            exit 1
          fi

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Swoop.app Swoop.zip
          shasum -a 256 Swoop.zip | tee Swoop.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swoop
          path: build/Swoop.zip

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Swoop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/Swoop.zip
            build/Swoop.zip.sha256
          generate_release_notes: true
          body: |
            **Download `Swoop.zip`**, unzip it and drag Swoop into Applications. Works on macOS 13+ (Apple silicon and Intel).

            Swoop isn't notarized yet, so the first time you open it macOS asks first. On macOS 15: System Settings → Privacy & Security → **Open Anyway**. On macOS 13–14: right-click Swoop → **Open**. Then allow Accessibility when asked, hold **Left ⌥ (Option)** and flick the mouse.
